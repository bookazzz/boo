name: Bybit Funding Schema Audit

on:
  push:
    branches: [master]
    paths:
      - 'inspect_bybit_funding.py'
      - '.github/workflows/regime-hybrid-pit.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas pyarrow huggingface_hub
      - name: Inspect funding parquet
        run: python inspect_bybit_funding.py | tee funding_schema_audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: bybit-funding-schema-audit
          path: |
            funding_schema_audit.json
            funding_schema_audit.log
          retention-days: 30
