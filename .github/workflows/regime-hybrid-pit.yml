name: Regime Hybrid v2 Execution Validation

on:
  push:
    branches: [master]
    paths:
      - 'v2_execution_validation.py'
      - '.github/workflows/regime-hybrid-pit.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow huggingface_hub requests
      - name: Download Binance and Bybit D1 PIT
        run: |
          mkdir -p binance_dataset bybit_dataset
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='rogerdehe/klines-binance',repo_type='dataset',allow_patterns=['futures/1d/*.parquet'],local_dir='binance_dataset')
          snapshot_download(repo_id='rogerdehe/klines-bybit',repo_type='dataset',allow_patterns=['futures/1d/*.parquet'],local_dir='bybit_dataset')
          PY
      - name: Reconstruct frozen v2 Bybit trades
        run: |
          python regime_hybrid_v2_crossvenue.py --signal-a binance_dataset --signal-b bybit_dataset --exec-root bybit_dataset --out v2_bybit --disable-pass-b | tee v2_replay.log
      - name: Run four execution validations
        run: |
          python v2_execution_validation.py | tee v2_execution_validation.log
          cat v2_execution_validation/validation_summary.json
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: regime-hybrid-v2-execution-validation
          path: |
            v2_execution_validation/
            v2_bybit/summary.json
            v2_execution_validation.log
            v2_replay.log
          retention-days: 30
