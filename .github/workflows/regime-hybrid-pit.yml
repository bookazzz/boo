name: Regime Hybrid v2 Cross-Venue Acceptance

on:
  push:
    branches: [master]
    paths:
      - 'regime_hybrid_v2_crossvenue.py'
      - 'v2_extended_acceptance.py'
      - '.github/workflows/regime-hybrid-pit.yml'
  workflow_dispatch:

jobs:
  v2:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pyarrow huggingface_hub
      - name: Download Binance and Bybit D1 PIT
        run: |
          mkdir -p binance_dataset bybit_dataset
          python - <<'PY'
          from huggingface_hub import snapshot_download
          snapshot_download(repo_id='rogerdehe/klines-binance',repo_type='dataset',allow_patterns=['futures/1d/*.parquet'],local_dir='binance_dataset')
          snapshot_download(repo_id='rogerdehe/klines-bybit',repo_type='dataset',allow_patterns=['futures/1d/*.parquet'],local_dir='bybit_dataset')
          PY
      - name: V2 Binance execution
        run: |
          python regime_hybrid_v2_crossvenue.py --signal-a binance_dataset --signal-b bybit_dataset --exec-root binance_dataset --out v2_binance --disable-pass-b | tee v2_binance.log
      - name: V2 Binance robustness
        run: |
          python v2_extended_acceptance.py --signal-a binance_dataset --signal-b bybit_dataset --exec-root binance_dataset --pass-a v2_binance/summary.json --out v2_binance_ext | tee v2_binance_ext.log
      - name: V2 Bybit execution
        run: |
          python regime_hybrid_v2_crossvenue.py --signal-a binance_dataset --signal-b bybit_dataset --exec-root bybit_dataset --out v2_bybit --disable-pass-b | tee v2_bybit.log
      - name: V2 Bybit robustness
        run: |
          python v2_extended_acceptance.py --signal-a binance_dataset --signal-b bybit_dataset --exec-root bybit_dataset --pass-a v2_bybit/summary.json --out v2_bybit_ext | tee v2_bybit_ext.log
      - name: Final v2 comparison
        run: |
          python - <<'PY'
          import json
          out={
            'rules':'frozen cross-venue consensus: BTC regime agreement; bull alt agreement + min(R90/Vol90); bear agreement + mean R30 least-oversold; v1 risk/execution unchanged',
            'binance':json.load(open('v2_binance/summary.json')),
            'binance_extended':json.load(open('v2_binance_ext/extended_acceptance.json')),
            'bybit':json.load(open('v2_bybit/summary.json')),
            'bybit_extended':json.load(open('v2_bybit_ext/extended_acceptance.json'))
          }
          json.dump(out,open('v2_acceptance.json','w'),indent=2); print(json.dumps(out,indent=2))
          PY
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: regime-hybrid-v2-crossvenue-acceptance
          path: |
            v2_acceptance.json
            v2_binance/
            v2_binance_ext/
            v2_bybit/
            v2_bybit_ext/
            *.log
          retention-days: 30
