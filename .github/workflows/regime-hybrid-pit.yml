name: Regime Hybrid v2 Liquidity Audit

on:
  push:
    branches: [master]
    paths:
      - 'v2_liquidity_30d_audit.py'
      - '.github/workflows/regime-hybrid-pit.yml'
  workflow_dispatch:

jobs:
  liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pandas requests
      - name: Audit exact 30d Bybit turnover
        run: python v2_liquidity_30d_audit.py | tee v2_liquidity_30d_audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: regime-hybrid-v2-liquidity-30d-audit
          path: |
            v2_liquidity_30d_audit/
            v2_liquidity_30d_audit.log
          retention-days: 30
